{% extends "base.html" %}

{% block title %}

Login

{% endblock %}

{% block content %}

<div class="container">

    <div class="row justify-content-center align-items-center min-vh-100">

        <div class="col-lg-5">

            <div class="card shadow-lg border-0 rounded-4">

                <div class="card-body p-5">

                    <h2 class="text-center fw-bold mb-4">

                        Welcome Back

                    </h2>

                    <form method="POST">                    

                        {% csrf_token %}

                        {{ form.as_p }}

                        <button class="btn btn-primary w-100 mt-3">

Login

                        </button>

                    </form>
                    <hr>

                    <p class="text-center">
                    Don't have an account?
                    <a href="{% url 'register' %}">
                    Register
                    </a>
                    </p>

                </div>
            </div>
        </div>
    </div>
</div>

{% endblock %}
